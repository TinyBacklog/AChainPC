; AstralChainRe settings. Delete this file to get the defaults back.
; Unknown keys and invalid values are reported in the log and ignored.

[display]
; Start in fullscreen.
fullscreen = false
; 0 = primary monitor; 1, 2, ... other monitors in SDL order.
display_index = 0
vsync = true

[performance]
; 60fps, with gameplay and cutscenes kept at the right speed. Takes effect on the next start.
fps60 = false
; Inline guest memory accesses, in builds made with them. false = slower, for diagnosis.
fastmem = true
; Faults of one inline access before its code falls back to the slower path; 0 = never.
fastmem_demote_after = 16
; Sync memory the GPU wrote before the game reads it. true = about 10% slower in combat;
; try it if an effect or picture looks stale.
reactive_flushing = false
; Internal resolution: 1 = native (1080p docked), 0.5, 0.75, 1.5 = 1620p, 2 = 2160p, 3, 4.
resolution_scale = 1
; How the image is scaled to the window: nearest, bilinear, bicubic, gaussian, scaleforce, fsr.
scaling_filter = fsr

[audio]
; 0-100
volume = 100

[overlay]
; Opens and closes the in-game overlay: a keyboard key name, and controller buttons
; pressed together (l3, r3, l, r, plus, minus or SDL button names, joined by +).
key = Insert
pad = l3+r3
; Small fps counter in a corner, shown even with the overlay closed.
fps_counter = false

[controls]
; steam_controller, keyboard or custom.
; steam_controller expects a Steam Controller (Puck 28de:1304) through SDL HIDAPI;
; without it connected nothing is mapped, so pick keyboard instead.
preset = keyboard
; With preset = custom, one line per input using suyu parameter strings, e.g.
; button_a = engine:sdl,port:0,guid:03000000de2800000413000002006800,button:1
; Inputs: button_a button_b button_x button_y button_lstick button_rstick button_l button_r
; button_zl button_zr button_plus button_minus button_dleft button_dup button_dright
; button_ddown button_slleft button_srleft button_home button_screenshot button_slright
; button_srright lstick rstick
